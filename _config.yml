title: "keem's blog."
description: "GO HAVE SOME FUN!"
url: "https://keemminxu.com"
baseurl: ""
theme: minima
future: true
lang: ko
timezone: Asia/Seoul
permalink: /:year/:month/:day/:title/
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

header_pages:
  - tags.html

exclude:
  - docs/
  - scripts/
  - Gemfile
  - Gemfile.lock
