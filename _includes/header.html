<header class="top-bar">
  <div class="top-bar-inner">
    <button class="menu-toggle" aria-label="Menu" onclick="toggleSidebar()">menu</button>
    <span class="top-bar-title">
      <span class="top-bar-status">
        <span class="status-loc">Seoul, Korea</span>
        <span class="status-sep">│</span>
        <span id="status-date">----</span>
        <span class="status-sep">│</span>
        <span id="status-weather">--</span>
        <span class="status-sep">│</span>
        <span id="status-time">--:--:--</span>
      </span>
    </span>
    <div class="window-controls">
      <button class="window-btn" aria-label="Minimize" type="button" onclick="closeSidebar()">─</button>
      <button class="window-btn" aria-label="Maximize" type="button" onclick="openSidebar()">▢</button>
      <button class="window-btn window-btn--close" aria-label="Close" type="button" onclick="window.close()">✕</button>
    </div>
  </div>
</header>
