<aside class="sidebar-left">
  <div class="sidebar-left-inner">
    <div class="profile-section">
      <div class="profile-model">
        <img src="{{ '/assets/profile/250x250.png' | relative_url }}" alt="Profile" class="profile-image">
      </div>
      <h2 class="profile-name">Jack Of All Trades</h2>
      <p class="profile-sub">이것저것 다 합니다</p>
      <p class="profile-desc">{{ site.description | escape }}</p>
    </div>

    <nav class="sidebar-nav">
      <a href="{{ '/' | relative_url }}" class="nav-item {% if page.url == '/' %}active{% endif %}">
        <span class="nav-icon">🏠</span> 홈
      </a>
      <div class="nav-section">
        <span class="nav-item nav-section-title"><span class="nav-icon">📂</span> 카테고리</span>
        <div class="nav-children">
          {% assign categories = site.categories | sort %}
          {% for cat in categories %}
            <a href="{{ '/category/' | append: cat[0] | relative_url }}" class="nav-child {% if page.url contains cat[0] %}active{% endif %}">
              {{ cat[0] }} <span class="nav-count">({{ cat[1].size }})</span>
            </a>
          {% endfor %}
        </div>
      </div>
      <a href="{{ '/tags/' | relative_url }}" class="nav-item {% if page.url == '/tags/' %}active{% endif %}">
        <span class="nav-icon">🏷️</span> 태그
      </a>
    </nav>
