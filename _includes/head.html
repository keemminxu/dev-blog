<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="MU5Kvlk3YqYMb6Jqinv-Ex2oF1FhnP9Btj2LcG4Y_tE" />
  {%- seo -%}

  <!-- OG Image (jekyll-seo-tag가 page.image 미설정 시 og:image를 생성하지 않으므로 직접 추가) -->
  {% if page.id %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/og/{{ page.slug }}.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
  {% elsif page.image == nil and site.image == nil %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/og/default.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
  {% endif %}

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Custom Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="69da4afd-2258-4121-84e7-b12c4e37ccac"></script>
</head>
